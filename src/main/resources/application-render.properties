# Render terminates HTTPS at its edge. Keep Tomcat's private/loopback proxy allowlist.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
goodware.allowed-origins=${RENDER_EXTERNAL_URL}
spring.datasource.hikari.data-source-properties.sslrootcert=${GOODWARE_DB_SSL_ROOT_CERT:/etc/secrets/prod-ca-2021.crt}
