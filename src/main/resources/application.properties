spring.application.name=goodware-backend
server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=102MB
spring.servlet.multipart.file-size-threshold=0
server.tomcat.threads.max=16
server.tomcat.max-connections=32
server.tomcat.accept-count=16
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.serialization.indent-output=true

# Runtime credentials: never use postgres/service_role in the running application.
spring.datasource.url=${GOODWARE_DB_URL}
spring.datasource.username=${GOODWARE_DB_USER}
spring.datasource.password=${GOODWARE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${GOODWARE_DB_SSL_ROOT_CERT}
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.jdbc.template.query-timeout=15
# Explicit migration account, only needed during schema upgrades.
spring.flyway.enabled=${GOODWARE_MIGRATE:false}
spring.flyway.url=${GOODWARE_MIGRATION_URL:${GOODWARE_DB_URL}}
spring.flyway.user=${GOODWARE_MIGRATION_USER:${GOODWARE_DB_USER}}
spring.flyway.password=${GOODWARE_MIGRATION_PASSWORD:${GOODWARE_DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration,classpath:db/postgres
spring.flyway.default-schema=goodware
spring.flyway.schemas=goodware
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${GOODWARE_BASELINE_EXISTING:false}
spring.flyway.baseline-version=2

# BFF session: tokens remain in server memory; no browser localStorage.
goodware.auth.url=https://tvnvjfaxuxwndlsnpiar.supabase.co
goodware.auth.publishable-key=${GOODWARE_SUPABASE_PUBLISHABLE_KEY:sb_publishable_aG00-6_b0ZpCjM-cWBYnhA_gep7780v}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${GOODWARE_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
